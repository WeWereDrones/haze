<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14181c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Haze">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Haze check</title>
<style>
  :root {
    --bg: #f3f5f4; --ink: #14181c; --muted: #5b666e; --line: #d5dbd8;
    --go: #17753f; --wait: #b06a00; --stop: #b3261e; --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181c; --ink: #eef2f0; --muted: #97a3a9; --line: #2b343a;
      --go: #4fd08a; --wait: #f0b24a; --stop: #ff8a80; --card: #1b2126;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; padding: 20px 20px 36px; max-width: 520px; margin: 0 auto; line-height: 1.4;
  }
  body { touch-action: pan-y pinch-zoom; }
  main { display: block; }
  @keyframes slide-in-r { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
  @keyframes slide-in-l { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
  #page.in-r { animation: slide-in-r 0.22s ease-out; }
  #page.in-l { animation: slide-in-l 0.22s ease-out; }
  @media (prefers-reduced-motion: reduce) { #page.in-r, #page.in-l { animation: none; } }
  button { font: inherit; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .modes { display: flex; gap: 8px; margin-bottom: 28px; }
  .modes button {
    flex: 1; padding: 12px 4px; font-weight: 600; font-size: 15px; color: var(--ink);
    background: transparent; border: 2px solid var(--line); border-radius: 10px;
  }
  .modes button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .verdict {
    font-size: clamp(72px, 26vw, 128px); font-weight: 900; letter-spacing: -0.03em;
    line-height: 0.95; margin: 0 0 8px;
  }
  .verdict.long { font-size: clamp(44px, 16vw, 84px); }
  .verdict.go { color: var(--go); }
  .verdict.wait { color: var(--wait); }
  .verdict.stop { color: var(--stop); }
  .verdict.none { color: var(--muted); }
  .reason { font-size: 20px; font-weight: 600; margin: 0 0 24px; }
  .facts {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 2px 12px; margin: 0 0 12px;
    font-size: 13px; line-height: 1.3;
  }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row span:first-child { color: var(--muted); }
  .row span:last-child { font-weight: 600; text-align: right; }
  .row .c-go { color: var(--go); }
  .row .c-wait { color: var(--wait); }
  .row .c-stop { color: var(--stop); }
  .warn { color: var(--stop); font-weight: 600; margin: 0 0 16px; }
  .charts { margin: 0 0 20px; }
  .chart { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 12px 6px; margin-bottom: 10px; }
  .chart-head { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; margin-bottom: 4px; }
  .chart-head span:first-child { font-weight: 600; }
  .chart-head span:last-child { color: var(--muted); }
  .range { display: flex; gap: 6px; margin: 0 0 10px; }
  .range button {
    padding: 8px 14px; font-weight: 600; font-size: 14px; color: var(--ink);
    background: transparent; border: 2px solid var(--line); border-radius: 8px;
  }
  .range button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chart-key { font-size: 12px; color: var(--muted); margin: 0 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chart svg { width: 100%; height: auto; display: block; }
  .primary { width: 100%; padding: 14px; font-weight: 700; background: var(--ink); color: var(--bg); border: 0; border-radius: 10px; }
  .ghost { padding: 10px 14px; font-weight: 600; color: var(--ink); background: transparent; border: 2px solid var(--line); border-radius: 10px; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .actions .ghost { flex: 1; }
  .settings { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 16px 16px; margin-top: 10px; }
  .settings label { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .settings label small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
  .settings label span { font-weight: 600; }
  .settings input {
    width: 84px; padding: 10px; font: inherit; font-weight: 700; text-align: right;
    color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 8px;
  }
  .settings .actions { margin-top: 14px; }
  .limits-row { margin-top: 0; }
  .limits-row .ghost { padding: 6px 12px; font-size: 13px; border-width: 1px; border-radius: 8px; }
  .smsg { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
  .note { color: var(--muted); font-size: 13px; margin: 10px 0 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .note a { color: inherit; }
</style>
</head>
<body>

<div class="modes" role="group" aria-label="Session">
  <button data-mode="swim" aria-pressed="true">Walk and swim</button>
  <button data-mode="ride" aria-pressed="false">Ride</button>
  <button data-mode="mid" aria-pressed="false">Mid-session</button>
</div>

<main id="page">
<h1 class="verdict none" id="verdict" aria-live="polite">...</h1>
<p class="reason" id="reason">Checking NEA.</p>
<p class="warn" id="warn" hidden></p>

<div class="facts" id="facts" hidden>
  <div id="f-rows"></div>
  <div class="row"><span>Reading</span><span id="f-time"></span></div>
</div>

<div class="range" id="range" role="group" aria-label="Chart range" hidden>
  <button data-range="12" aria-pressed="true">Last 12h</button>
  <button data-range="48" aria-pressed="false">Last 48h</button>
</div>
<div class="charts" id="charts"></div>
</main>

<div class="actions limits-row">
  <button class="ghost" id="toggle-settings" aria-expanded="false">Limits</button>
  <button class="ghost" id="toggle-info" aria-expanded="false">Info</button>
</div>

<div class="settings" id="settings" hidden>
  <label><span>Falling trend<small>Start limit</small></span><input id="s-falling" type="number" inputmode="numeric" min="0" max="300"></label>
  <label><span>Flat trend<small>Start limit</small></span><input id="s-flat" type="number" inputmode="numeric" min="0" max="300"></label>
  <label><span>Rising trend<small>Start limit</small></span><input id="s-rising" type="number" inputmode="numeric" min="0" max="300"></label>
  <label><span>Ride stricter by<small>Taken off all three start limits</small></span><input id="s-rideOffset" type="number" inputmode="numeric" min="0" max="100"></label>
  <label><span>Ease off above<small>Mid-session, next-hour estimate</small></span><input id="s-easeAbove" type="number" inputmode="numeric" min="0" max="300"></label>
  <label><span>Stop above<small>Also head home above this</small></span><input id="s-stopAbove" type="number" inputmode="numeric" min="0" max="300"></label>
  <div class="actions">
    <button class="primary" id="save">Save limits</button>
    <button class="ghost" id="reset">Reset</button>
  </div>
  <p class="smsg" id="s-msg"></p>
</div>

<p class="note" id="info" hidden>Swipe left or right to change tab. Data: NEA 1-hr PM2.5 via data.gov.sg. Each reading is stamped on the hour and appears 15 to 45 minutes later. If this page shows an error, open <a href="https://www.haze.gov.sg/">haze.gov.sg</a> and read the 1-hr PM2.5 tab.</p>

<script>
/* ---- Your rule. Change these in the Limits panel, or edit the defaults here. ---- */
var DEFAULTS = {
  limits: { falling: 90, flat: 80, rising: 75 }, // start limits in ug/m3
  stopAbove: 150,        // Band 3 (High) starts at 151. Also the "head home" line.
  easeAbove: 110,        // mid-session: ease off if next-hour estimate passes this
  trendWindowHours: 2,   // compare latest reading with this many hours earlier
  trendDelta: 5,         // change of this many ug/m3 or more counts as rising/falling
  staleMinutes: 120,     // warn if the latest reading is older than this
  historyMax: 48,        // hourly readings kept per region (the chart shows 12 or 48)
  rideOffset: 0          // subtract this from every start limit on rides
};
var CONFIG = JSON.parse(JSON.stringify(DEFAULTS));
var NEA_HIGH = 150; // NEA Band 3 (High) is 151 and above. Fixed, not one of your settings.

/* ---- Pure logic (no network, no DOM) ---- */
function getPoints(items, region) {
  var pts = [];
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var v = it && it.readings && it.readings.pm25_one_hourly && it.readings.pm25_one_hourly[region];
    var t = it ? Date.parse(it.timestamp) : NaN;
    if (typeof v === 'number' && !isNaN(t)) {
      var pub = it.updatedTimestamp ? Date.parse(it.updatedTimestamp) : NaN;
      pts.push({ t: t, v: v, pub: isNaN(pub) ? null : pub });
    }
  }
  pts.sort(function (a, b) { return a.t - b.t; });
  var out = [];
  for (var k = 0; k < pts.length; k++) {
    if (out.length && out[out.length - 1].t === pts[k].t) out[out.length - 1] = pts[k];
    else out.push(pts[k]);
  }
  return out;
}

function pointBefore(pts, hours) {
  var latest = pts[pts.length - 1];
  var target = latest.t - hours * 3600000;
  for (var j = pts.length - 2; j >= 0; j--) {
    if (pts[j].t <= target + 60000) return pts[j];
  }
  return null;
}

function decide(items, region, nowMs, cfg) {
  cfg = cfg || CONFIG;
  var pts = getPoints(items, region);
  if (!pts.length) return { verdict: 'none', reason: 'No readings returned.' };

  var latest = pts[pts.length - 1];
  var ref = pointBefore(pts, cfg.trendWindowHours);
  var trend = 'flat', delta = null;
  if (ref) {
    delta = latest.v - ref.v;
    if (delta >= cfg.trendDelta) trend = 'rising';
    else if (delta <= -cfg.trendDelta) trend = 'falling';
  }
  var limit = cfg.limits[trend];
  var ageMin = Math.round((nowMs - latest.t) / 60000);

  var verdict, reason;
  if (latest.v > cfg.stopAbove) {
    verdict = 'stop'; reason = 'High band. Do not go out.';
  } else if (latest.v <= limit) {
    verdict = 'go'; reason = 'Under your limit of ' + limit + '.';
  } else {
    verdict = 'wait'; reason = 'Over your limit of ' + limit + '. Re-check in an hour.';
  }
  return {
    verdict: verdict, reason: reason, value: latest.v, trend: trend, delta: delta,
    limit: limit, timestamp: latest.t, pub: latest.pub, ageMin: ageMin,
    stale: ageMin > cfg.staleMinutes, series: pts.slice(-cfg.historyMax)
  };
}

var RANK = { go: 1, wait: 2, stop: 3 };

function summarise(parts, regions, reasonFor) {
  var worst = null, stale = false, ageMin = 0;
  for (var i = 0; i < parts.length; i++) {
    if (!worst || RANK[parts[i].verdict] > RANK[worst.verdict]) worst = parts[i];
    if (parts[i].stale) stale = true;
    if (parts[i].ageMin > ageMin) ageMin = parts[i].ageMin;
  }
  var name = worst.region.charAt(0).toUpperCase() + worst.region.slice(1);
  return {
    verdict: worst.verdict, reason: reasonFor(worst, name, regions.length > 1), parts: parts,
    worst: worst, timestamp: parts[0].timestamp, pub: parts[0].pub, ageMin: ageMin, stale: stale
  };
}

/* Start-of-session rule per region; the worst region decides. */
function decideMany(items, regions, nowMs, cfg, limitOffset) {
  cfg = cfg || CONFIG;
  var off = limitOffset || 0;
  var c = {};
  for (var k in cfg) c[k] = cfg[k];
  c.limits = { falling: cfg.limits.falling - off, flat: cfg.limits.flat - off, rising: cfg.limits.rising - off };
  var parts = [];
  for (var i = 0; i < regions.length; i++) {
    var d = decide(items, regions[i], nowMs, c);
    if (d.verdict === 'none') return { verdict: 'none', reason: 'No ' + regions[i] + ' reading returned.', parts: [] };
    d.region = regions[i];
    parts.push(d);
  }
  return summarise(parts, regions, function (w, name, many) {
    if (w.verdict === 'go') return many ? 'All regions are under their limits.' : w.reason;
    return (many ? name + ': ' : '') + w.reason;
  });
}

/* Mid-session: go = carry on, wait = ease off, stop = head home. */
function decideMid(items, regions, nowMs, cfg) {
  cfg = cfg || CONFIG;
  var parts = [];
  for (var i = 0; i < regions.length; i++) {
    var pts = getPoints(items, regions[i]);
    if (!pts.length) return { verdict: 'none', reason: 'No ' + regions[i] + ' reading returned.', parts: [] };
    var latest = pts[pts.length - 1];
    var prev = pointBefore(pts, 1);
    var d1 = prev ? latest.v - prev.v : null;
    var proj = latest.v + Math.max(d1 || 0, 0);
    var verdict = 'go', why = 'go';
    if (latest.v > cfg.stopAbove) { verdict = 'stop'; why = 'over'; }
    else if (proj > cfg.stopAbove) { verdict = 'stop'; why = 'pace'; }
    else if (proj > cfg.easeAbove) { verdict = 'wait'; }
    var ageMin = Math.round((nowMs - latest.t) / 60000);
    parts.push({
      region: regions[i], verdict: verdict, why: why, value: latest.v, delta1h: d1, projected: proj,
      timestamp: latest.t, pub: latest.pub, ageMin: ageMin, stale: ageMin > cfg.staleMinutes,
      series: pts.slice(-cfg.historyMax)
    });
  }
  return summarise(parts, regions, function (w, name, many) {
    var p = many ? name + ': ' : '';
    if (w.verdict === 'stop' && w.why === 'over') return p + 'Over ' + cfg.stopAbove + '. Head home.';
    if (w.verdict === 'stop') return p + 'At this rate it passes ' + cfg.stopAbove + ' next hour. Head home.';
    if (w.verdict === 'wait') return p + 'Heading past ' + cfg.easeAbove + '. Ease off and re-check in 30 minutes.';
    return 'Nothing close to your limits. Carry on.';
  });
}

/* ---- Storage helpers ---- */
function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }

function applySaved(cfg, saved) {
  if (!saved) return cfg;
  function num(x, lo, hi) { return typeof x === 'number' && isFinite(x) && x >= lo && x <= hi ? x : null; }
  var f = num(saved.falling, 0, 300), fl = num(saved.flat, 0, 300), r = num(saved.rising, 0, 300);
  var ro = num(saved.rideOffset, 0, 100), ea = num(saved.easeAbove, 0, 300), sa = num(saved.stopAbove, 0, 300);
  if (f !== null) cfg.limits.falling = f;
  if (fl !== null) cfg.limits.flat = fl;
  if (r !== null) cfg.limits.rising = r;
  if (ro !== null) cfg.rideOffset = ro;
  if (ea !== null) cfg.easeAbove = ea;
  if (sa !== null) cfg.stopAbove = sa;
  return cfg;
}

/* ---- UI ---- */
if (typeof document !== 'undefined') {
  var API = 'https://api-open.data.gov.sg/v2/real-time/api/pm25';
  var MODES = ['swim', 'ride', 'mid'];
  var $ = function (id) { return document.getElementById(id); };
  var mode = MODES.indexOf(lsGet('hazeMode')) >= 0 ? lsGet('hazeMode') : 'swim';
  var lastRun = 0, runId = 0;
  var chartRange = 12;   // bars shown; always starts at 12, toggle to 48
  var lastD = null;

  try { applySaved(CONFIG, JSON.parse(lsGet('hazeCfg'))); } catch (e) {}

  var fmtDate = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Singapore' });
  var fmtTime = new Intl.DateTimeFormat('en-SG', { timeZone: 'Asia/Singapore', hour: 'numeric', minute: '2-digit', hour12: true });
  var fmtHour = new Intl.DateTimeFormat('en-SG', { timeZone: 'Asia/Singapore', hour: 'numeric', hour12: true });
  var fmtHour24 = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Singapore', hour: '2-digit', hourCycle: 'h23' });
  var fmtDay = new Intl.DateTimeFormat('en-SG', { timeZone: 'Asia/Singapore', weekday: 'short' });
  function sgHourNum(ms) { return parseInt(fmtHour24.format(new Date(ms)), 10) % 24; }
  function sgDay(ms) { return fmtDay.format(new Date(ms)); }
  function sgHourLong(ms) { return fmtHour.format(new Date(ms)).toLowerCase(); }
  function sgTime(ms) { return fmtTime.format(new Date(ms)); }
  function sgHour(ms) {
    var p = fmtHour.format(new Date(ms)).toLowerCase().replace(/\s/g, '');
    return p.replace('am', 'a').replace('pm', 'p');
  }

  function show(v, text, why) {
    var el = $('verdict');
    el.className = 'verdict ' + v + (text.length > 4 ? ' long' : '');
    el.textContent = text;
    $('reason').textContent = why;
  }

  async function fetchJson(url) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, 10000);
    try {
      var r = await fetch(url, { cache: 'no-store', signal: ctl.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } finally { clearTimeout(timer); }
  }

  async function getItems() {
    var day = function (back) { return fmtDate.format(new Date(Date.now() - back * 86400000)); };
    var res = await Promise.all([
      fetchJson(API + '?date=' + day(0)),
      fetchJson(API + '?date=' + day(1)).catch(function () { return null; }),
      fetchJson(API + '?date=' + day(2)).catch(function () { return null; })
    ]);
    var items = [];
    for (var i = res.length - 1; i >= 0; i--) {
      if (res[i] && res[i].data && res[i].data.items) items = items.concat(res[i].data.items);
    }
    if (!items.length) {
      var jl = await fetchJson(API);
      items = (jl.data && jl.data.items) || [];
    }
    return items;
  }

  function trim(items) {
    var keep = items.slice().sort(function (a, b) { return Date.parse(a.timestamp) - Date.parse(b.timestamp); }).slice(-52);
    return keep.map(function (it) {
      var r = (it.readings && it.readings.pm25_one_hourly) || {};
      return { timestamp: it.timestamp, updatedTimestamp: it.updatedTimestamp,
               readings: { pm25_one_hourly: { south: r.south, east: r.east, north: r.north, west: r.west, central: r.central } } };
    });
  }

  function labelFor(region) {
    if (region === 'east') return 'East (ECP to Changi)';
    return mode === 'swim' ? 'South (walk and swim)' : 'South (Downtown)';
  }

  function svgEl(name, attrs) {
    var e = document.createElementNS('http://www.w3.org/2000/svg', name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function buildChart(p, lineAt) {
    var series = p.series.slice(-chartRange);
    var n = series.length;
    var peak = 0;
    for (var q = 1; q < n; q++) if (series[q].v > series[peak].v) peak = q;
    var dense = n > 14;

    var wrap = document.createElement('div');
    wrap.className = 'chart';
    var head = document.createElement('div');
    head.className = 'chart-head';
    var h1 = document.createElement('span');
    h1.textContent = labelFor(p.region);
    head.appendChild(h1);
    wrap.appendChild(head);
    var key = document.createElement('p');
    key.className = 'chart-key';
    key.textContent = 'Dash=' + lineAt + '. Red=NEA High >' + NEA_HIGH +
      '. Peak ' + series[peak].v + ', ' + sgDay(series[peak].t) + ' ' + sgHourLong(series[peak].t) + '.';
    wrap.appendChild(key);

    var W = 320, H = 118, padX = 6, top = 18, base = 92;
    var maxv = Math.max(NEA_HIGH, CONFIG.stopAbove);
    series.forEach(function (s) { if (s.v > maxv) maxv = s.v; });
    maxv = maxv * 1.05;
    var slot = (W - padX * 2) / n;
    var bw = Math.min(36, slot - (n > 24 ? 1.5 : (n > 8 ? 8 : 10)));
    var fs = n > 8 ? 10 : 11;
    var svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img',
      'aria-label': 'Last ' + n + ' hourly readings. Latest ' + series[n - 1].v + ', peak ' + series[peak].v + '.' +
        (dense ? '' : ' Values: ' + series.map(function (s) { return s.v; }).join(', ')) });

    var ny = base - NEA_HIGH / maxv * (base - top);
    svg.appendChild(svgEl('line', { x1: padX, x2: W - padX, y1: ny, y2: ny, 'stroke-width': 1.5, style: 'stroke:var(--stop)' }));
    var nl = svgEl('text', { x: padX, y: ny - 4, 'text-anchor': 'start', 'font-size': 10, 'font-weight': 600, style: 'fill:var(--stop)' });
    nl.textContent = 'NEA High';
    svg.appendChild(nl);
    var ly = base - lineAt / maxv * (base - top);
    svg.appendChild(svgEl('line', { x1: padX, x2: W - padX, y1: ly, y2: ly, 'stroke-dasharray': '4 3', 'stroke-width': 1.5, style: 'stroke:var(--muted)' }));

    if (dense) {   // thin divider at each midnight
      series.forEach(function (s, i) {
        if (i > 0 && sgHourNum(s.t) === 0) {
          var mx = padX + i * slot;
          svg.appendChild(svgEl('line', { x1: mx, x2: mx, y1: top - 4, y2: base + 4, 'stroke-width': 1, style: 'stroke:var(--line)' }));
        }
      });
    }

    var clampX = function (x) { return Math.max(padX + 10, Math.min(W - padX - 10, x)); };
    series.forEach(function (s, i) {
      var h = Math.max(2, s.v / maxv * (base - top));
      var x = padX + i * slot + (slot - bw) / 2, y = base - h, cx = x + bw / 2;
      var cls = s.v <= lineAt ? 'go' : (s.v <= NEA_HIGH ? 'wait' : 'stop');
      svg.appendChild(svgEl('rect', { x: x, y: y, width: bw, height: h, rx: bw > 8 ? 3 : 1, style: 'fill:var(--' + cls + ')' }));

      var showVal = !dense || i === n - 1 || (i === peak && n - 1 - i > 4);
      if (showVal) {
        var val = svgEl('text', { x: clampX(cx), y: y - 4, 'text-anchor': 'middle', 'font-size': fs, 'font-weight': 600, style: 'fill:var(--ink)' });
        val.textContent = s.v;
        svg.appendChild(val);
      }
      var label = '';
      if (!dense) label = sgHour(s.t);
      else if (sgHourNum(s.t) === 0) label = sgDay(s.t);
      else if (sgHourNum(s.t) % 6 === 0) label = sgHour(s.t);
      if (label) {
        var lab = svgEl('text', { x: clampX(cx), y: 108, 'text-anchor': 'middle', 'font-size': fs, style: 'fill:var(--muted)' });
        lab.textContent = label;
        svg.appendChild(lab);
      }
    });
    wrap.appendChild(svg);
    return wrap;
  }

  function renderCharts(d) {
    var charts = $('charts');
    charts.textContent = '';
    var any = false;
    d.parts.forEach(function (p) {
      if (!p.series || p.series.length < 2) return;
      any = true;
      if (mode === 'mid') charts.appendChild(buildChart(p, CONFIG.easeAbove));
      else charts.appendChild(buildChart(p, p.limit));
    });
    $('range').hidden = !any;
  }

  function render(d, opts) {
    opts = opts || {};
    var words = mode === 'mid' ? { go: 'CARRY ON', wait: 'EASE OFF', stop: 'HEAD HOME' } : { go: 'GO', wait: 'WAIT', stop: 'STOP' };
    if (opts.offline) {
      show('none', 'OFFLINE', 'No connection. The last reading (' + sgTime(d.timestamp) + ', checked ' + sgTime(opts.fetchedAt) +
        ') said ' + words[d.verdict] + '. That is not current. Check haze.gov.sg.');
    } else {
      show(d.verdict, words[d.verdict], d.reason);
    }
    var rows = $('f-rows');
    rows.textContent = '';
    d.parts.forEach(function (p) {
      var row = document.createElement('div');
      row.className = 'row';
      var a = document.createElement('span');
      a.textContent = labelFor(p.region);
      var b = document.createElement('span');
      b.className = 'c-' + p.verdict;
      if (mode === 'mid') {
        var t1 = p.delta1h === null ? 'trend unknown' : (p.delta1h > 0 ? '+' : '') + p.delta1h + ' in 1h';
        b.textContent = p.value + ', ' + t1 + ', next hour about ' + p.projected;
      } else {
        var tr = p.delta === null ? 'trend unknown' : p.trend + ' ' + (p.delta > 0 ? '+' : '') + p.delta;
        b.textContent = p.value + ', ' + tr + ', limit ' + p.limit;
      }
      row.appendChild(a); row.appendChild(b);
      rows.appendChild(row);
    });
    $('f-time').textContent = sgTime(d.timestamp) + (d.pub ? ' (out ' + sgTime(d.pub) + ')' : '') +
      ', checked ' + sgTime(opts.fetchedAt || Date.now()) + (opts.offline ? ' (last good)' : '');
    $('facts').hidden = false;

    lastD = d;
    renderCharts(d);

    if (d.stale) {
      $('warn').textContent = 'This reading is ' + d.ageMin + ' minutes old, older than expected. Check haze.gov.sg before relying on it.';
      $('warn').hidden = false;
    } else {
      $('warn').hidden = true;
    }
  }

  function compute(items) {
    var ride = mode === 'ride';
    var now = Date.now();
    if (mode === 'mid') return decideMid(items, ['south', 'east'], now, CONFIG);
    return decideMany(items, ride ? ['south', 'east'] : ['south'], now, CONFIG, ride ? CONFIG.rideOffset : 0);
  }

  var RETRY_MS = [0, 1200, 3000];   // waits before each attempt; a phone waking from sleep often fails the first one
  var FRESH_MS = 120000;            // tab and chart switches reuse data younger than this
  var mem = null;                   // { items, fetchedAt } from the last good fetch

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function describe(e) {
    if (!e) return 'unknown error';
    if (e.name === 'AbortError') return 'the request timed out after 10 seconds';
    var m = /^HTTP (\d+)/.exec(e.message || '');
    if (m) return 'NEA returned HTTP ' + m[1] + (m[1] === '429' ? ' (too many requests)' : '');
    if (e.name === 'TypeError') return 'the network request failed (no signal, or blocked)';
    return e.message || String(e);
  }

  async function loadItems(force, my) {
    if (!force && mem && Date.now() - mem.fetchedAt < FRESH_MS) return mem;
    var lastErr = null;
    for (var a = 0; a < RETRY_MS.length; a++) {
      if (RETRY_MS[a]) {
        show('none', '...', 'Connecting, attempt ' + (a + 1) + ' of ' + RETRY_MS.length + '.');
        await sleep(RETRY_MS[a]);
        if (my !== runId) return null;
      }
      try {
        var items = await getItems();
        if (my !== runId) return null;
        mem = { items: items, fetchedAt: Date.now() };
        lsSet('hazeCache', JSON.stringify({ fetchedAt: mem.fetchedAt, items: trim(items) }));
        return mem;
      } catch (e) {
        lastErr = e;
      }
    }
    var err = new Error(describe(lastErr));
    err.network = true;
    throw err;
  }

  function showWarn(text) {
    $('warn').textContent = text;
    $('warn').hidden = false;
  }

  async function run(force) {
    var my = ++runId;
    var fresh = !force && mem && Date.now() - mem.fetchedAt < FRESH_MS;
    if (!fresh) lastRun = Date.now();
    if (!fresh) {
      show('none', '...', 'Checking NEA.');
      $('facts').hidden = true;
      $('warn').hidden = true;
      $('charts').textContent = '';
      $('range').hidden = true;
    }

    var loaded;
    try {
      loaded = await loadItems(force, my);
    } catch (e) {
      if (my !== runId) return;
      // Could not reach NEA. Fall back to the last good reading, clearly marked as old.
      var cached = null;
      try { cached = JSON.parse(lsGet('hazeCache')); } catch (e2) {}
      if (cached && cached.items && cached.items.length) {
        try {
          var dc = compute(cached.items);
          if (dc.verdict !== 'none') {
            render(dc, { offline: true, fetchedAt: cached.fetchedAt });
            showWarn('Could not reach NEA: ' + e.message + '.');
            return;
          }
        } catch (e3) {}
      }
      show('none', 'ERROR', 'Could not load the NEA feed: ' + e.message + '. Open haze.gov.sg and read the South 1-hr PM2.5 number.');
      return;
    }
    if (!loaded || my !== runId) return;

    // Data arrived. Anything that fails from here on is a bug in the app, not a connection problem.
    try {
      var d = compute(loaded.items);
      if (d.verdict === 'none') { show('none', 'NO DATA', d.reason + ' Check haze.gov.sg.'); return; }
      render(d, { fetchedAt: loaded.fetchedAt });
    } catch (e4) {
      show('none', 'APP ERROR', 'The data loaded but the app failed to show it: ' + (e4 && e4.message ? e4.message : e4) + '. Check haze.gov.sg.');
    }
  }

  function animate(dir) {
    var pg = $('page');
    pg.classList.remove('in-r', 'in-l');
    if (!dir) return;
    void pg.offsetWidth;
    pg.classList.add(dir > 0 ? 'in-r' : 'in-l');
  }

  function setMode(m, dir) {
    mode = m;
    animate(dir);
    lsSet('hazeMode', m);
    var btns = document.querySelectorAll('.modes button');
    for (var i = 0; i < btns.length; i++) btns[i].setAttribute('aria-pressed', btns[i].getAttribute('data-mode') === m);
    run();
  }

  /* settings panel */
  function fillSettings() {
    $('s-falling').value = CONFIG.limits.falling;
    $('s-flat').value = CONFIG.limits.flat;
    $('s-rising').value = CONFIG.limits.rising;
    $('s-rideOffset').value = CONFIG.rideOffset;
    $('s-easeAbove').value = CONFIG.easeAbove;
    $('s-stopAbove').value = CONFIG.stopAbove;
  }
  function readInt(id) {
    var raw = $(id).value;
    if (raw === '' || isNaN(Number(raw))) return null;
    return Math.round(Number(raw));
  }
  /* Limits and Info share one slot: opening one closes the other, so the page stays on one screen. */
  function togglePanel(which) {
    var panels = { settings: ['settings', 'toggle-settings'], info: ['info', 'toggle-info'] };
    for (var k in panels) {
      var box = $(panels[k][0]), btn = $(panels[k][1]);
      box.hidden = k === which ? !box.hidden : true;
      btn.setAttribute('aria-expanded', String(!box.hidden));
    }
    if (!$('settings').hidden) { fillSettings(); $('s-msg').textContent = ''; }
  }
  function toggleSettings() { togglePanel('settings'); }
  function saveSettings() {
    var vals = {
      falling: readInt('s-falling'), flat: readInt('s-flat'), rising: readInt('s-rising'),
      rideOffset: readInt('s-rideOffset'), easeAbove: readInt('s-easeAbove'), stopAbove: readInt('s-stopAbove')
    };
    for (var k in vals) {
      var hi = k === 'rideOffset' ? 100 : 300;
      if (vals[k] === null || vals[k] < 0 || vals[k] > hi) {
        $('s-msg').textContent = 'Every field needs a whole number from 0 to ' + hi + '. Nothing saved.';
        return;
      }
    }
    applySaved(CONFIG, vals);
    lsSet('hazeCfg', JSON.stringify(vals));
    var msg = 'Saved.';
    if (vals.falling < vals.flat || vals.flat < vals.rising) msg += ' Note: limits are usually falling >= flat >= rising.';
    if (vals.easeAbove >= vals.stopAbove) msg += ' Note: ease off should be below stop.';
    $('s-msg').textContent = msg;
    run();
  }
  function resetSettings() {
    CONFIG = JSON.parse(JSON.stringify(DEFAULTS));
    lsSet('hazeCfg', '');
    fillSettings();
    $('s-msg').textContent = 'Back to defaults.';
    run();
  }

  var mbtns = document.querySelectorAll('.modes button');
  for (var i = 0; i < mbtns.length; i++) {
    (function (b) { b.addEventListener('click', function () { setMode(b.getAttribute('data-mode')); }); })(mbtns[i]);
    mbtns[i].setAttribute('aria-pressed', mbtns[i].getAttribute('data-mode') === mode);
  }
  var rbtns = document.querySelectorAll('.range button');
  for (var r = 0; r < rbtns.length; r++) {
    (function (b) {
      b.addEventListener('click', function () {
        chartRange = Number(b.getAttribute('data-range'));
        for (var k = 0; k < rbtns.length; k++) rbtns[k].setAttribute('aria-pressed', rbtns[k] === b);
        if (lastD) renderCharts(lastD);
      });
    })(rbtns[r]);
  }
  $('toggle-settings').addEventListener('click', toggleSettings);
  $('toggle-info').addEventListener('click', function () { togglePanel('info'); });
  $('save').addEventListener('click', saveSettings);
  $('reset').addEventListener('click', resetSettings);

  /* Swipe left = next tab, swipe right = previous. No wrap-around. */
  var SWIPE_MIN = 60;   // px of horizontal travel needed
  var SWIPE_MAX_MS = 700;
  var EDGE = 24;        // ignore swipes that start this close to a screen edge (Android back gesture)
  var touch = null;

  function swipeTo(step) {
    var i = MODES.indexOf(mode) + step;
    if (i < 0 || i >= MODES.length) return;
    setMode(MODES[i], step);
  }
  document.addEventListener('touchstart', function (e) {
    touch = null;
    if (!e.touches || e.touches.length !== 1) return;
    var tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    var t = e.touches[0];
    if (t.clientX < EDGE || t.clientX > window.innerWidth - EDGE) return;
    touch = { x: t.clientX, y: t.clientY, at: Date.now() };
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (!touch) return;
    var t = e.changedTouches && e.changedTouches[0];
    var s = touch;
    touch = null;
    if (!t) return;
    var dx = t.clientX - s.x, dy = t.clientY - s.y;
    if (Date.now() - s.at > SWIPE_MAX_MS) return;
    if (Math.abs(dx) < SWIPE_MIN || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    swipeTo(dx < 0 ? 1 : -1);
  }, { passive: true });
  document.addEventListener('touchcancel', function () { touch = null; }, { passive: true });
  document.addEventListener('keydown', function (e) {   // laptop testing: arrow keys
    var tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (e.key === 'ArrowRight') swipeTo(1);
    else if (e.key === 'ArrowLeft') swipeTo(-1);
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && Date.now() - lastRun > 60000) run(true);
  });
  window.addEventListener('pageshow', function () {
    if (Date.now() - lastRun > 60000) run(true);
  });
  setInterval(function () { if (!document.hidden) run(true); }, 300000);
  window.addEventListener('online', function () { run(true); });

  run(true);

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
}
</script>
</body>
</html>
